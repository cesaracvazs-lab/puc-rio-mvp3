<svg width="900" height="420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arquitetura do MVP">
  <defs>
    <style>
      .title { font: bold 26px Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 18px Arial, sans-serif; fill: #374151; }
      .box { fill: #f3f4f6; stroke: #4b5563; stroke-width: 2; rx: 18; }
      .blue { fill: #dbeafe; stroke: #2563eb; }
      .green { fill: #dcfce7; stroke: #16a34a; }
      .purple { fill: #f3e8ff; stroke: #7c3aed; }
      .text { font: 16px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .arrow { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#374151" />
    </marker>
  </defs>

  <text x="450" y="40" text-anchor="middle" class="title">Sistema de Controle de Pacientes</text>

  <rect x="60" y="90" width="220" height="180" class="box blue"/>
  <text x="170" y="130" text-anchor="middle" class="subtitle">API Principal</text>
  <text x="170" y="165" text-anchor="middle" class="text">FastAPI</text>
  <text x="170" y="195" text-anchor="middle" class="small">Cadastro de pacientes</text>
  <text x="170" y="220" text-anchor="middle" class="small">Filtros, paginação e</text>
  <text x="170" y="242" text-anchor="middle" class="small">ordenação dinâmica</text>

  <rect x="340" y="90" width="220" height="180" class="box green"/>
  <text x="450" y="130" text-anchor="middle" class="subtitle">Banco de Dados</text>
  <text x="450" y="170" text-anchor="middle" class="text">SQLite</text>
  <text x="450" y="200" text-anchor="middle" class="small">pacientes.db</text>
  <text x="450" y="225" text-anchor="middle" class="small">SQLAlchemy + Pydantic</text>

  <rect x="620" y="90" width="220" height="180" class="box purple"/>
  <text x="730" y="130" text-anchor="middle" class="subtitle">API Externa</text>
  <text x="730" y="170" text-anchor="middle" class="text">ViaCEP</text>
  <text x="730" y="200" text-anchor="middle" class="small">Consulta de CEP</text>
  <text x="730" y="225" text-anchor="middle" class="small">Endereço automático</text>

  <path d="M 280 180 L 340 180" class="arrow"/>
  <path d="M 560 180 L 620 180" class="arrow"/>
  <path d="M 170 270 L 170 320 L 730 320 L 730 270" class="arrow"/>

  <text x="450" y="350" text-anchor="middle" class="small">Fluxo: cadastro → consulta ViaCEP → persistência → consulta com filtros e paginação</text>
</svg>
