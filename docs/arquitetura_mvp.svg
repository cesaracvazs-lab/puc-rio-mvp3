<svg width="1100" height="610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arquitetura do MVP">
  <defs>
    <style>
      .title { font: bold 26px Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 18px Arial, sans-serif; fill: #374151; }
      .box { fill: #f3f4f6; stroke: #4b5563; stroke-width: 2; rx: 18; }
      .blue { fill: #dbeafe; stroke: #2563eb; }
      .green { fill: #dcfce7; stroke: #16a34a; }
      .purple { fill: #f3e8ff; stroke: #7c3aed; }
      .text { font: 16px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .arrow { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#374151" />
    </marker>
  </defs>

  <text x="550" y="45" text-anchor="middle" class="title">Sistema de Controle de Pacientes</text>

  <rect x="55" y="105" width="260" height="190" class="box blue"/>
  <text x="185" y="145" text-anchor="middle" class="subtitle">API Principal</text>
  <text x="185" y="180" text-anchor="middle" class="text">FastAPI</text>
  <text x="185" y="210" text-anchor="middle" class="small">Cadastro de pacientes</text>
  <text x="185" y="235" text-anchor="middle" class="small">Filtros e paginação</text>
  <text x="185" y="260" text-anchor="middle" class="small">Orquestra os serviços</text>

  <rect x="400" y="105" width="260" height="190" class="box" style="fill:#fef3c7;stroke:#d97706"/>
  <text x="530" y="145" text-anchor="middle" class="subtitle">API Secundária</text>
  <text x="530" y="180" text-anchor="middle" class="text">Alertas e Retorno</text>
  <text x="530" y="210" text-anchor="middle" class="small">Cálculo de urgência</text>
  <text x="530" y="235" text-anchor="middle" class="small">Regras por situação</text>
  <text x="530" y="260" text-anchor="middle" class="small">REST / FastAPI</text>

  <rect x="790" y="105" width="255" height="190" class="box purple"/>
  <text x="917" y="145" text-anchor="middle" class="subtitle">API Externa</text>
  <text x="917" y="180" text-anchor="middle" class="text">ViaCEP</text>
  <text x="917" y="215" text-anchor="middle" class="small">Consulta de CEP</text>
  <text x="917" y="240" text-anchor="middle" class="small">Endereço automático</text>
  <text x="917" y="265" text-anchor="middle" class="small">Serviço público REST</text>

  <rect x="55" y="390" width="260" height="135" class="box green"/>
  <text x="185" y="430" text-anchor="middle" class="subtitle">Banco principal</text>
  <text x="185" y="465" text-anchor="middle" class="text">SQLite</text>
  <text x="185" y="495" text-anchor="middle" class="small">pacientes.db</text>

  <rect x="400" y="390" width="260" height="135" class="box green"/>
  <text x="530" y="430" text-anchor="middle" class="subtitle">Banco secundário</text>
  <text x="530" y="465" text-anchor="middle" class="text">SQLite</text>
  <text x="530" y="495" text-anchor="middle" class="small">alertas.db</text>

  <path d="M 315 190 L 400 190" class="arrow"/>
  <path d="M 185 295 L 185 390" class="arrow"/>
  <path d="M 530 295 L 530 390" class="arrow"/>
  <path d="M 315 245 C 460 335, 700 335, 790 245" class="arrow"/>

  <text x="550" y="565" text-anchor="middle" class="small">API principal → API de Alertas: cálculo do retorno e gerenciamento de alertas</text>
  <text x="550" y="590" text-anchor="middle" class="small">API principal → ViaCEP: consulta e preenchimento automático do endereço</text>
</svg>
